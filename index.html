const K = s => s.split(' ').map(k => `<kbd>${k}</kbd>`).join(' ');
const GUIDE = [
  { id: 'start', icon: 'book', title: 'Start here', tour: 'welcome', sum: 'How Folio is laid out and your first ten minutes.', sections: [
    { h: 'The big idea', b: `<p>Folio breaks a long piece of writing into small, movable pieces. Instead of one 90,000-word file, a novel is a set of <b>scenes</b> grouped into <b>chapters</b>. That makes it easy to:</p>
      <ul><li>find anything in seconds,</li><li>move a scene to a different chapter by dragging it,</li><li>see the shape of the whole book on index cards,</li><li>track progress scene by scene.</li></ul>
      <p>When you export, Folio stitches everything back together into one properly formatted manuscript.</p>` },
    { h: 'The screen', b: `<ul><li><b>Binder</b> (left): every chapter, scene, character, place and note.</li>
      <li><b>Centre</b>: the page, corkboard, outline or story map.</li>
      <li><b>Inspector</b> (right): <b>This scene</b> (details, notes, comments, history) and <b>Tools</b> (Polish, Assist) for whatever is open.</li>
      <li><b>Status bar</b> (bottom): word counts, today’s progress and where your work is saved.</li></ul>
      <p>The buttons at the top left and top right show or hide the binder and inspector. While you type, everything except the page fades away; move the mouse to bring it back.</p>` },
    { h: 'Your first ten minutes', b: `<ol><li>From the home screen, click <b>New project</b>. Choose <i>Short story</i>, <i>Novella</i> or <i>Novel</i> to start with a ready-made structure of chapters and story beats, or <i>Blank</i>.</li>
      <li>Add your author name in <b>More › Settings</b>. Export uses it for the title page and page headers.</li>
      <li>Click a scene in the binder and start typing. There is no Save button to remember.</li>
      <li>Choose <b>More › Save to a file on disk</b> so a copy lives in your Documents or Dropbox folder too. (See <i>Saving, backups and the app</i>.)</li>
      <li>Set a goal with the <b>Goals</b> button if you like a target to aim for.</li></ol>`,
      tip: 'The sample project, “The Keeper of Gull Rock”, is a safe place to experiment. Delete it from the home screen whenever you like.' },
  ] },
  { id: 'binder', icon: 'sidebar', title: 'The binder', tour: 'binder', sum: 'Organise chapters, scenes and everything else.', sections: [
    { h: 'What goes where', b: `<ul><li><b>Manuscript</b>: the book itself. Only this section is exported.</li>
      <li><b>Characters</b> and <b>Places</b>: sheets with ready-made fields (age, appearance, wants and needs, wound, arc, and so on).</li>
      <li><b>Research</b> and <b>Notes</b>: anything else, such as research articles, worldbuilding, to-do lists or cut scenes.</li>
      <li><b>Trash</b>: deleted items wait here until you empty it.</li></ul>` },
    { h: 'Everyday tasks', b: `<ul><li><b>Add</b>: the <b>Doc</b> and <b>Folder</b> buttons at the bottom of the binder, or ${K('Alt N')}. New items go into the folder you’re working in.</li>
      <li><b>Rename</b>: double-click a title, or select it and press ${K('F2')}.</li>
      <li><b>Reorder</b>: drag an item above or below another, or onto a folder to put it inside.</li>
      <li><b>More options</b>: right-click for Duplicate, Open in split view, Move to trash, and more.</li>
      <li><b>Find</b>: type in <i>Filter binder</i> to search titles and synopses.</li></ul>` },
    { h: 'Folders as chapters and parts', b: `<p>A folder in the Manuscript exports as a chapter heading by default. To change that, right-click the folder and choose <b>Export as</b> <i>Part</i> or <i>No heading</i>. A Part folder can contain chapter folders.</p>
      <p>The coloured dot beside a scene shows its <b>label</b>. The small number shows its word count.</p>` , tip: 'One scene per document is the sweet spot. Small documents are easier to move, label and track than whole chapters.' },
    { h: 'Leaving something out', b: `<p>Untick <b>Include in export</b> (Inspector › Details) to keep a scene in the binder but out of the manuscript. This is perfect for alternate versions or a scene you aren’t sure about. Cut material is better moved to Notes than deleted.</p>` },
  ] },
  { id: 'write', icon: 'pen', title: 'Writing and formatting', tour: 'write', sum: 'The editor, toolbar, smart punctuation and comments.', sections: [
    { h: 'Typing', b: `<p>Folio formats prose the way books are set: first-line indents, no gaps between paragraphs, and curly quotes. (Prefer a blank line between paragraphs? Turn off indents in Settings.) As you type:</p>
      <ul><li><code>"</code> and <code>'</code> become “ ” and ‘ ’,</li><li><code>--</code> becomes an em dash —,</li><li><code>...</code> becomes an ellipsis …</li></ul>
      <p>You can turn this off in <b>More › Settings › Writing</b>.</p>` },
    { h: 'The toolbar', b: `<p>The toolbar keeps to the essentials: undo and redo, paragraph style, <b>bold</b>, <i>italic</i>, underline, scene break and comment. Click <b>Aa</b> for everything else: font, size, strikethrough, text colour, highlight, clear formatting, alignment, line spacing and lists. Snapshot, find and read aloud sit at the right-hand end.</p>
      <p><b>Formatting bubble:</b> select some text and a small bar appears above it with bold, italic, underline, highlight, comment and clear formatting. It’s the quickest way to format without reaching for the toolbar. You can turn it off in <b>More › Settings</b>.</p>
      <p>Formatting you apply here (italics for emphasis, for example) carries through to export. Fonts and sizes are for <i>your</i> comfort; the export preset decides how the manuscript looks.</p>`,
      tip: 'Don’t format your manuscript by hand for submission. Write in whatever font you enjoy, and let Export produce standard manuscript format.' },
    { h: 'Scene breaks', b: `<p>The scene-break button inserts a break inside a document. It exports as <b>#</b> in manuscript format or <b>* * *</b> in reader and eBook copies. Separate documents inside a chapter folder also get a scene break between them automatically.</p>` },
    { h: 'Comments', b: `<p>Select text and press ${K('Ctrl Alt M')} (or the speech-bubble button) to attach a note. The text is highlighted, and the comment appears in <b>Inspector › Comments</b>. Click <b>Show</b> on a comment to jump to it, and <b>Resolve</b> when it’s dealt with. Comments are never exported.</p>` },
    { h: 'Reading a whole chapter', b: `<p>Select a folder and choose <b>Write</b> to see all its scenes as one continuous document. You can edit right there, and each part still saves to its own scene.</p>` },
    { h: 'Quiet writing', b: `<p>When you start typing, the toolbars, binder, inspector and status bar fade out so there’s nothing on screen but your words. Move the mouse (or tap outside the page) and they return. It’s like a gentle focus mode that switches itself on and off. Turn it off under <b>More › Theme and appearance</b> if you prefer everything to stay put.</p>` },
    { h: 'Comfort settings', b: `<p>In <b>More › Settings › Writing</b> you can change the editor font (including Atkinson Hyperlegible, which is designed for readability), text size, line height, page width, book-style indents or spaced paragraphs, paper-on-a-desk view, typewriter scrolling and spell check. The zoom menu is at the bottom right.</p>` },
  ] },
  { id: 'plan', icon: 'grid', title: 'Planning: corkboard, outline, story map', tour: 'plan', sum: 'See the shape of your story and move it around.', sections: [
    { h: 'Corkboard', b: `<p>Select a folder (or the Manuscript) and choose <b>Corkboard</b>. Each scene is an index card with its title and synopsis. Edit cards directly, drag them to reorder the real manuscript, and click <b>New card</b> to plan scenes you haven’t written yet. <b>Read &amp; edit all</b> opens the whole folder as one document.</p>`,
      tip: 'Plotters: fill the corkboard with one-line synopses before you draft. Pantsers: write first, then summarise each scene on its card afterwards. It’s the fastest way to see what you actually wrote.' },
    { h: 'Outline', b: `<p>The same scenes as a table, with synopsis, status, label, point of view, words and word target. Use it to check pacing (are some scenes much longer than others?) and to update many scenes quickly.</p>` },
    { h: 'Story map', b: `<p>Every scene in order, left to right. Mark which <b>plotlines</b> and <b>characters</b> appear in each one. Gaps jump out: a subplot that disappears for ten chapters, or a character missing from the middle of the book. Manage plotlines and their colours in <b>More › Settings › Labels and plotlines</b>.</p>` },
    { h: 'Status and labels', b: `<p><b>Status</b> tracks where a scene is in your process (To do, First draft, Revised, Final). <b>Labels</b> are yours to define: use them for POV characters, timelines or plot threads. Both show in the binder, on cards and in the outline.</p>` },
  ] },
  { id: 'inspector', icon: 'panel', title: 'The inspector', tour: 'inspector', sum: 'Synopsis, status, notes and comments for each scene.', sections: [
    { h: 'Details', b: `<ul><li><b>Synopsis</b>: one or two sentences on what happens and why it matters. It appears on the corkboard and outline, and can be exported.</li>
      <li><b>Status</b>, <b>Label</b> and <b>Point of view</b>.</li>
      <li><b>Characters in this scene</b> and <b>Plotlines</b>, which feed the story map and Assist’s continuity checks.</li>
      <li><b>Word target</b> for this scene, with a progress bar.</li>
      <li><b>Include in export</b>.</li></ul>` },
    { h: 'Notes', b: `<p>A private scratchpad for each document: revision to-dos, research links, ideas. Notes are never exported.</p>` },
    { h: 'Comments, History, Polish and Assist', b: `<p>These are covered in their own chapters: <i>Writing and formatting</i> (comments), <i>Revising</i> (history and Polish) and <i>Assist</i>.</p>` },
  ] },
  { id: 'bible', icon: 'user', title: 'Characters, places and research', sum: 'Your story bible, always one click away.', sections: [
    { h: 'Character sheets', b: `<p>Add a character in the <b>Characters</b> section. Each sheet has fields for role, age, occupation, appearance, personality, wants (outer goal), needs (inner truth), fear or old wound, flaw, arc, voice and backstory. Fill in only what helps you.</p>
      <p>Details like eye colour, hair and age matter beyond reference: Assist’s <b>Story checks</b> compare them against what your scenes say, and flag contradictions.</p>` },
    { h: 'Places', b: `<p>Place sheets cover the kind of place, time period, what it looks like, its sounds and smells, mood, who goes there, and why it matters to the story. These are handy for keeping a setting consistent over a long book.</p>` },
    { h: 'Keeping them beside you', b: `<p>Right-click a character or place and choose <b>Open in split view</b> to keep the sheet open next to the scene you’re writing.</p>`, tip: 'Tag the characters in each scene (Inspector › Details). It takes two seconds and powers the story map and continuity checks.' },
  ] },
  { id: 'revise', icon: 'history', title: 'Revising', tour: 'revise', sum: 'Snapshots, Polish, find and replace, read aloud.', sections: [
    { h: 'Snapshots and history', b: `<p>A snapshot is a saved copy of one document. Folio takes one automatically the first time you edit a document each day. Take your own with the camera button or ${K('Ctrl Shift S')} before any big rewrite.</p>
      <p>In <b>Inspector › History</b>, <b>Compare</b> highlights what was added and removed. <b>Restore</b> rolls back, but snapshots the current version first, so you can always change your mind.</p>`,
      tip: 'Rewrite boldly. With a snapshot taken, the old version is one click away, so you never need “chapter3_v2_FINAL_real.docx” again.' },
    { h: 'Polish (style check)', b: `<p>Open <b>Inspector › Polish</b> to highlight adverbs, passive voice, filter words (saw, heard, felt), hedges (very, just, really), clichés, showy dialogue tags, long sentences and echoes (the same word repeated close together). It also shows a readability score and grade level.</p>
      <p>Polish only highlights. It never changes your words, and plenty of what it flags is fine on purpose.</p>`,
      tip: 'Don’t run Polish while drafting; it pulls you out of the story. Use it in revision, and do one category per pass: adverbs only, then echoes only. That’s much less overwhelming than everything at once.' },
    { h: 'Find and replace', b: `<p>${K('Ctrl F')} to find, ${K('Ctrl H')} to replace. Search the current view, the manuscript or the whole project, with <b>Match case</b> and <b>Whole words</b> options. <b>Replace all</b> is a single undo, and across the project Folio takes snapshots first. Search results are highlighted in place.</p>` },
    { h: 'Read aloud', b: `<p>Put the cursor where you want to start and press ${K('Ctrl Shift U')} (or the speaker button). Folio reads sentence by sentence, highlighting as it goes. Change the voice and speed in the control bar. Start typing at any time and it stops so you can fix something.</p>`,
      tip: 'Listening catches what reading doesn’t: missing words, repeated words, clunky rhythm and dialogue that nobody would really say.' },
  ] },
  { id: 'assist', icon: 'bulb', title: 'Assist (help that stays out of your prose)', tour: 'assist', sum: 'Story checks and optional free AI.', sections: [
    { h: 'The promise', b: `<p>Assist never writes your story. Nothing it produces goes into your manuscript. Results stay in the panel until you choose <b>Add to notes</b> or <b>Use as synopsis</b>. Nothing is sent to the internet, and nothing costs money.</p>` },
    { h: 'Story checks (no AI)', b: `<p>Click <b>Check the whole manuscript</b> to look for:</p><ul><li>names that look like misspellings of a character (<i>Marren</i> for <i>Maren</i>),</li><li>eye or hair colour that contradicts the character sheet or another scene,</li><li>ages that don’t match,</li><li>characters who appear but aren’t tagged (with a one-click fix),</li><li>characters who are tagged but never mentioned,</li><li>scenes with no synopsis or point of view.</li></ul>` },
    { h: 'With a free AI (optional)', b: `<p>Turn one on under <b>Assist › AI engine</b>:</p><ul><li><b>Chrome’s built-in AI</b>: a one-time download, then it runs on your computer. Needs desktop Chrome on a fairly powerful machine.</li><li><b>Ollama</b> (any browser): install it free from ollama.com. Setup steps are shown in the Assist tab.</li></ul>
      <p>Then you can ask for a synopsis draft, editor-style questions about the scene, reader reactions, “what if” ideas, a continuity check against your character sheets, or ask anything about your story.</p>`,
      tip: 'The best use is as a sounding board when you’re stuck. Ask “What does the reader not know yet at this point?” rather than “What should happen next?”. Its questions spark your own ideas.' },
    { h: 'Without any AI', b: `<p><b>Questions</b> draws from a built-in deck of craft questions about stakes, desire, conflict and change. <b>Synopsis</b> builds a summary from your own sentences.</p>` },
  ] },
  { id: 'goals', icon: 'target', title: 'Goals and habits', tour: 'goals', sum: 'Targets, deadlines, streaks, history and celebrations.', sections: [
    { h: 'Setting goals', b: `<p>Click <b>Goals</b> to set:</p><ul><li>a <b>manuscript target</b> (for example 80,000 words),</li><li>an optional <b>deadline</b>: Folio divides the remaining words by the days left, so your daily target adjusts as you go,</li><li>or a fixed <b>daily goal</b> instead.</li></ul><p>Each scene can also have its own target (Inspector › Details).</p>` },
    { h: 'Tracking', b: `<p>The ring in the status bar fills as you write today. The Goals window shows your streak and a 30-day chart. Deleting words reduces today’s count, so heavy revision days can look small. That’s expected; revision is real work.</p>`,
      tip: 'Set a daily goal small enough that you’d be embarrassed to miss it. A streak of 300-word days beats occasional 3,000-word binges.' },
    { h: 'Celebrations', b: `<p>When you reach today’s goal, a small card appears at the bottom of the screen with your word count and how many days in a row you’ve written, and the status-bar ring glows. Folio does the same when a scene reaches its own target, and when the manuscript passes a quarter, half and three-quarters of its target, with a little confetti when the draft is complete.</p><p>Each one shows once and fades by itself; it never interrupts your typing. Goals you had already met before setting them are not celebrated. To turn celebrations off, go to <b>More › Theme and appearance</b>.</p>` },
  ] },
  { id: 'workspace', icon: 'focus', title: 'Your workspace', tour: 'workspace', sum: 'Focus mode, split view, themes and quick open.', sections: [
    { h: 'Focus mode', b: `<p>${K('Ctrl Shift F')} or the <b>Focus</b> button hides everything but the page and goes full screen. A small word count shows at the bottom. Press ${K('Esc')} to return. In settings you can fade every paragraph except the one you’re writing, and turn on typewriter scrolling so the line you’re typing stays mid-screen.</p>` },
    { h: 'Split view', b: `<p>Shows a second document on the right: a character sheet, an outline or the previous chapter. Use the split button at the top, or right-click a binder item and choose <b>Open in split view</b>. You can edit both. If the same document is open on both sides, the right one is read-only to keep things safe.</p>` },
    { h: 'Quick open', b: `<p>${K('Ctrl K')}, then type part of any title and press Enter. It’s the fastest way around a big project.</p>` },
    { h: 'Themes and comfort', b: `<p><b>More › Theme and appearance</b> lets you choose light, dark, sepia, or match your device, and set the <b>interface size</b> (Small, Normal or Large) if the menus and panels feel too small or too big. Page zoom is at the bottom right. Show or hide the binder and inspector with the buttons at either end of the top bar.</p>` },
    { h: 'Smaller screens', b: `<p>On a laptop or a narrow window, the inspector slides over the page instead of squeezing it. Open it with the panel button at the top right, and click anywhere on the page to put it away.</p>` },
  ] },
  { id: 'export', icon: 'download', title: 'Export and import', tour: 'export', sum: 'Submission-ready manuscripts, eBooks and importing old work.', sections: [
    { h: 'Exporting', b: `<p>Click <b>Export</b> (${K('Ctrl Shift E')}). Pick a <b>format</b> and a <b>preset</b>, then check the live preview:</p>
      <ul><li><b>Standard manuscript</b>: what agents, editors and contests expect. Title page with contact details and word count, Times New Roman 12pt, double spaced, surname / title / page number header, <b>#</b> scene breaks, chapters on new pages.</li>
      <li><b>Reader copy</b>: book-style, for beta readers or printing.</li>
      <li><b>eBook</b>: clean styles that e-readers can reflow.</li></ul>
      <p>Formats: Word (.docx, which also opens in Pages and Google Docs), ePub (Kindle, Apple Books, Kobo), PDF via print, web page, Markdown and plain text.</p>`,
      tip: 'Fill in your author name and contact block in More › Settings first. Standard manuscript format puts them on the title page.' },
    { h: 'Choosing what’s included', b: `<p>Only the Manuscript is exported, and only items with <b>Include in export</b> ticked. Comments and notes never are. Synopses can be added (useful for a synopsis document for agents).</p>` },
    { h: 'Importing', b: `<p>Use the import button at the bottom of the binder (or <b>More › Import documents</b>) to bring in .docx, .txt, .md or .html files. Folio can split a long file so headings become chapters and scene breaks (<code>#</code> or <code>***</code>) become scenes, so an existing novel in Word can become a structured project in one step.</p>` },
  ] },
  { id: 'safety', icon: 'shield', title: 'Saving, backups and the app', tour: 'safety', sum: 'Where your work lives and how to keep it safe.', sections: [
    { h: 'How saving works', b: `<p>Folio saves to your browser half a second after you stop typing. The status bar shows where: <b>Saved in browser</b>, or <b>Saved to <i>name</i>.folio</b> once you’ve linked a file. ${K('Ctrl S')} saves immediately, but you never need it.</p>` },
    { h: 'Save to a file (strongly recommended)', b: `<p><b>More › Save to a file on disk</b> (Chrome and Edge) links the project to a <code>.folio</code> file. After that, every change also saves to that file. Put it in Dropbox, OneDrive, Google Drive or iCloud and it’s backed up off your computer automatically.</p>
      <p>If the browser asks for permission again after a restart, click <b>Allow saving to file</b> in the yellow bar.</p>`,
      tip: 'Do this on day one of every project. Browser storage is safe day to day, but clearing your browsing data would erase it. Your .folio file is the copy you control.' },
    { h: 'Backups and restore', b: `<p>Folio keeps a backup for each of the last 14 days you worked on a project, plus your last 10 manual backups. Open <b>More › Backups and restore</b> (${K('Ctrl Alt Shift B')}). Restoring opens the backup as a separate project, so it never overwrites your current work. <b>Download backup</b> saves a .folio copy in any browser.</p>` },
    { h: 'The installed app', b: `<p>Installed Folio has its own window and icon, works with no internet, and opens <code>.folio</code> files when you double-click them (Chrome and Edge). When a new version is available you’ll see <b>A new version of Folio is ready</b>; click <b>Update now</b>, and your work is saved before it reloads.</p>` },
    { h: 'Sharing Folio with other writers', b: `<p>Choose <b>More › Share Folio with a writer</b> (or <b>Share</b> on the home screen) to send the link. Everyone who opens it gets their own empty Folio. Projects are saved only on each person’s own device, so nobody can see anyone else’s writing, and nothing is uploaded.</p><p>To work on a story <i>with</i> someone, send them your project with <b>More › Download backup</b>; they open it with <b>Open a .folio file</b>. Each copy is then edited separately.</p>` },
    { h: 'Moving between computers or browsers', b: `<p>Each browser keeps its own storage. To move a project, either keep it as a linked .folio file in a synced folder and open it from the other computer (<b>Open a .folio file</b> on the home screen), or use <b>Download backup</b> and open that file on the other side.</p>` },
  ] },
  { id: 'workflows', icon: 'list', title: 'Suggested workflows', sum: 'Proven ways to use Folio for each length of story.', sections: [
    { h: 'Short story (1,000–7,500 words)', b: `<ol><li>New project › <i>Short story</i>. It starts with four beats: Opening, Complication, Crisis, Resolution, each with a hint on its card.</li><li>Write a one-line synopsis on each card, or skip straight to drafting.</li><li>Draft in one or two sittings in focus mode.</li><li>Rest it for a day, then read it aloud.</li><li>One Polish pass for echoes and filter words.</li><li>Export › Word › Standard manuscript, and submit.</li></ol>` },
    { h: 'Novella (17,500–40,000 words)', b: `<ol><li>New project › <i>Novella</i>, which starts with nine chapters, each holding one story beat (Setup, Inciting incident, Midpoint turn, and so on).</li><li>Fill in character sheets for the two or three main characters.</li><li>Corkboard: one card per scene with a synopsis.</li><li>Set a deadline in Goals and let the daily target guide you.</li><li>Draft scene by scene. Mark status <i>First draft</i> as each one is done, and the corkboard becomes a progress map.</li><li>Revise using the Revising chapter’s routine.</li></ol>` },
    { h: 'Novel (60,000+ words)', b: `<ol><li>New project › <i>Novel</i>, which starts with three acts (as Part folders) and chapters for each classic story beat.</li><li>In <b>More › Settings</b>, define your plotlines, and labels for your POV characters.</li><li>Outline on the corkboard at whatever level of detail suits you.</li><li>Draft with a daily goal. Use split view to keep the outline or a character sheet beside you.</li><li>Tag characters in each scene, then check the story map for dropped threads.</li><li>Run Assist › Story checks on the whole manuscript before revising.</li><li>Revise in passes: structure (corkboard and story map), then scenes, then lines (Polish, read aloud).</li></ol>` },
    { h: 'A revision routine that works', b: `<ol><li><b>Snapshot first</b>: ${K('Ctrl Shift S')}.</li><li><b>Big picture</b>: read the corkboard top to bottom. Does every scene change something? Merge, cut or move.</li><li><b>Scene level</b>: for each scene, check its synopsis against what’s on the page, and use Assist › Questions when stuck.</li><li><b>Line level</b>: Polish one category at a time, then read aloud.</li><li><b>Consistency</b>: run Story checks.</li><li><b>Compare</b> with the snapshot to see how far you’ve come.</li></ol>` },
  ] },
  { id: 'keys', icon: 'keyboard', title: 'Keyboard shortcuts', sum: 'Every shortcut in one place.', keys: true, sections: [] },
  { id: 'faq', icon: 'help', title: 'Questions and troubleshooting', sum: 'Quick answers to common problems.', sections: [
    { h: 'My project isn’t on the home screen', b: `<p>Projects live in the browser where you made them. If you switched browsers, used the downloaded Folio.html instead of the installed app (or the other way round), or cleared browsing data, use <b>Open a .folio file</b> with your linked file or a downloaded backup. Also check <b>More › Backups and restore</b>, which lists the automatic daily backups.</p>` },
    { h: 'It says “Allow saving to file”', b: `<p>Browsers ask again for permission to write to a file after a restart. Click the button once and saving to the file resumes. Your work was still being saved in the browser meanwhile.</p>` },
    { h: 'The toolbars disappeared while I was typing', b: `<p>That’s <b>quiet writing</b>: everything except the page fades out while you type. Move the mouse and it all comes back. To keep the toolbars visible all the time, untick quiet writing in <b>More › Theme and appearance</b>.</p>` },
    { h: 'Spell check isn’t underlining anything', b: `<p>Spell check uses your browser’s own dictionary. Make sure it’s on in <b>More › Settings › Writing</b> and in your browser’s settings (in Chrome: Settings › Languages › Spell check).</p>` },
    { h: 'Read aloud has no voices or sounds robotic', b: `<p>Voices come from your computer. Windows, macOS, iOS and Android include several, and you can add more in your system’s speech or accessibility settings. Edge offers especially natural-sounding voices.</p>` },
    { h: 'The AI options say “not set up”', b: `<p>That’s fine: AI is optional, and Story checks, Questions and Synopsis all work without it. To turn it on, see the <i>Assist</i> chapter. Chrome’s built-in AI needs desktop Chrome on a fairly powerful computer. Ollama works in any browser once installed.</p>` },
    { h: 'Exported Word file looks different from my screen', b: `<p>That’s by design: export applies the preset’s formatting (for example Times New Roman, double spaced) whatever font you write in. Choose another preset, or adjust the options in the Export dialog.</p>` },
  ] },
];

/* ---------- guide panel ---------- */
const GUIDE_STATE = { el: null, ch: null, q: '' };
function guideRead() { return (PREFS.guideRead = PREFS.guideRead || {}); }
function markRead(id) { const tourCh = GUIDE.find(c => c.tour === id); const k = tourCh ? tourCh.id : id; if (!guideRead()[k]) { guideRead()[k] = 1; savePrefs(); if (GUIDE_STATE.el) drawGuide(); } }

function openGuide(ch) {
  closeMenu();
  if (!GUIDE_STATE.el) {
    GUIDE_STATE.el = h('aside', { class: 'guide', id: 'guide', role: 'complementary', 'aria-label': 'Folio guide' });
    document.body.append(GUIDE_STATE.el);
    document.body.classList.add('guide-open');
  }
  GUIDE_STATE.ch = ch === undefined ? (PREFS.guideCh || null) : ch;
  GUIDE_STATE.q = '';
  drawGuide();
  setTimeout(() => GUIDE_STATE.el && GUIDE_STATE.el.querySelector('.guide-search')?.focus({ preventScroll: true }), 30);
}
function closeGuide(keepPlace) {
  if (!GUIDE_STATE.el) return;
  GUIDE_STATE.el.remove(); GUIDE_STATE.el = null; document.body.classList.remove('guide-open');
  if (!keepPlace) { PREFS.guideCh = GUIDE_STATE.ch; savePrefs(); }
}
function toggleGuide() { GUIDE_STATE.el ? closeGuide() : openGuide(); }

function guideSectionsText(c) { return c.sections.map(s => s.h + ' ' + s.b.replace(/<[^>]+>/g, ' ') + ' ' + (s.tip || '')).join(' '); }

function drawGuide() {
  const g = GUIDE_STATE.el; if (!g) return;
  const scroll = g.querySelector('.guide-body')?.scrollTop || 0; const keepScroll = g.dataset.ch === String(GUIDE_STATE.ch) && !GUIDE_STATE.q;
  g.textContent = ''; g.dataset.ch = String(GUIDE_STATE.ch);
  const read = guideRead(); const nRead = GUIDE.filter(c => read[c.id]).length;
  const search = h('input', { class: 'inp guide-search', type: 'search', placeholder: 'Search the guide', 'aria-label': 'Search the guide', value: GUIDE_STATE.q,
    oninput: e => { GUIDE_STATE.q = e.target.value; drawGuideBody(); } });
  g.append(h('div', { class: 'guide-h' },
    h('div', { class: 'guide-title' }, icon('help', 18), h('b', {}, 'Folio guide'), h('span', { class: 'spacer' }),
      h('button', { class: 'icon-btn', title: 'Close guide (F1)', 'aria-label': 'Close guide', onclick: () => closeGuide() }, icon('x'))),
    search));
  const body = h('div', { class: 'guide-body' }); g.append(body);
  GUIDE_STATE.body = body;
  drawGuideBody(nRead);
  if (keepScroll) body.scrollTop = scroll;
}

function drawGuideBody() {
  const body = GUIDE_STATE.body; if (!body) return; body.textContent = ''; body.scrollTop = 0;
  const read = guideRead(); const q = GUIDE_STATE.q.trim().toLowerCase();
  const go = id => { GUIDE_STATE.ch = id; GUIDE_STATE.q = ''; PREFS.guideCh = id; savePrefs(); drawGuide(); GUIDE_STATE.body.scrollTop = 0; };

  if (q) {
    const hits = [];
    for (const c of GUIDE) {
      if (c.keys) { for (const [k, d] of SHORTCUTS) if ((k + ' ' + d).toLowerCase().includes(q)) hits.push({ c, h: d, snip: k }); continue; }
      for (const s of c.sections) {
        const txt = (s.h + ' ' + s.b.replace(/<[^>]+>/g, ' ') + ' ' + (s.tip || '')).replace(/\s+/g, ' ');
        const i = txt.toLowerCase().indexOf(q);
        if (i >= 0) hits.push({ c, h: s.h, snip: (i > 40 ? '…' : '') + txt.slice(Math.max(0, i - 40), i + 90) + '…' });
      }
    }
    body.append(h('div', { class: 'guide-kicker' }, hits.length ? `${hits.length} result${hits.length > 1 ? 's' : ''}` : 'No results. Try another word, such as “backup”, “chapter” or “export”.'));
    for (const r of hits.slice(0, 40)) body.append(h('button', { class: 'guide-hit', onclick: () => { go(r.c.id); setTimeout(() => { const el = [...GUIDE_STATE.body.querySelectorAll('h3')].find(x => x.textContent === r.h); el && el.scrollIntoView({ block: 'start' }); }, 20); } },
      h('span', { class: 'gh-ch' }, r.c.title), h('b', {}, r.h), h('span', { class: 'gh-snip' }, r.snip)));
    return;
  }

  const c = GUIDE.find(x => x.id === GUIDE_STATE.ch);
  if (!c) {
    // contents
    const nRead = GUIDE.filter(x => read[x.id]).length;
    body.append(
      h('div', { class: 'guide-hero' },
        h('h2', {}, 'Learn Folio'),
        h('p', {}, 'Read a chapter, or click “Show me” to have Folio point at the real buttons. Keep this panel open while you try things; it stays out of the way of the page.'),
        h('div', { class: 'guide-hero-acts' },
          h('button', { class: 'btn primary', onclick: () => startTour('welcome') }, icon('play', 15), 'Take the 2-minute tour'),
          h('span', { class: 'hint' }, `${nRead} of ${GUIDE.length} chapters read`))),
    );
    const list = h('div', { class: 'guide-toc' });
    GUIDE.forEach((x, i) => list.append(h('button', { class: 'guide-toc-row' + (read[x.id] ? ' read' : ''), onclick: () => go(x.id) },
      h('span', { class: 'gt-num' }, read[x.id] ? icon('check', 14) : String(i + 1)),
      h('span', { class: 'gt-text' }, h('b', {}, x.title), h('span', {}, x.sum)),
      icon('chev', 15))));
    body.append(list);
    return;
  }

  const idx = GUIDE.indexOf(c);
  body.append(h('button', { class: 'link-btn guide-back', onclick: () => go(null) }, '‹ All chapters'));
  body.append(h('div', { class: 'guide-ch-h' }, h('span', { class: 'guide-kicker' }, `Chapter ${idx + 1} of ${GUIDE.length}`), h('h2', {}, c.title), h('p', {}, c.sum)));
  if (c.tour) body.append(h('button', { class: 'btn sm primary guide-show', onclick: () => startTour(c.tour) }, icon('play', 14), 'Show me on screen'));
  if (c.keys) {
    body.append(h('div', { class: 'kbd-list guide-keys' }, SHORTCUTS.map(([k, d]) => [h('span', {}, k.split(' / ').map((x, i) => [i ? ' / ' : '', h('kbd', {}, fixMod(x))])), h('span', {}, d)])));
  }
  for (const s of c.sections) {
    const sec = h('section', { class: 'guide-sec' }, h('h3', {}, s.h), h('div', { class: 'guide-text', html: s.b.replace(/<kbd>Ctrl/g, '<kbd>' + modKey()) }));
    if (s.tip) sec.append(h('div', { class: 'guide-tip' }, h('b', {}, 'Tip'), h('span', {}, s.tip)));
    body.append(sec);
  }
  const prev = GUIDE[idx - 1], next = GUIDE[idx + 1];
  body.append(h('div', { class: 'guide-nav' },
    prev ? h('button', { class: 'btn sm', onclick: () => go(prev.id) }, '‹ ' + prev.title) : h('span'),
    next ? h('button', { class: 'btn sm primary', onclick: () => go(next.id) }, next.title + ' ›') : h('button', { class: 'btn sm', onclick: () => go(null) }, 'All chapters')));
  if (!read[c.id]) { read[c.id] = 1; savePrefs(); }
}
function modKey() { return /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl'; }
function fixMod(s) { return s.replace(/Ctrl/g, modKey()); }

/* ---------- first-run welcome ---------- */
function maybeWelcome() {
  if (PREFS.welcomed) return;
  PREFS.welcomed = 1; savePrefs();
  setTimeout(() => {
    if (TOUR.steps || document.querySelector('.modal-back')) return;
    modal({ title: 'Welcome to Folio', body: h('div', { class: 'welcome' },
      h('p', {}, 'Folio is a writing studio for short stories, novellas and novels. A sample story is open so you can explore safely.'),
      h('p', {}, 'Would you like a quick tour? It takes about two minutes, and the full guide is always available from the ', h('b', {}, '?'), ' button or ', h('kbd', {}, 'F1'), '.')),
      actions: [{ label: 'Not now', onClick: () => toast('The guide is under the ? button whenever you want it.', 3500) }, { label: 'Open the guide', onClick: () => openGuide(null) }, { label: 'Take the tour', primary: true, onClick: () => startTour('welcome') }] });
  }, 600);
}

/* =========================================================
   Folio — start up
   ========================================================= */
initPWA();
wireChrome();
PWA.ready = boot().catch(e => { console.error(e); document.body.append(h('p', { style: { padding: '20px' } }, 'Folio could not start: ' + e.message)); });

</script>
</body>
