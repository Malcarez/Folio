<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Folio: a writing studio for short stories, novellas and novels.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16645f">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="icon" href="icons/folio.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Folio Writing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a writer's desk in three panes — binder | paper on the desk | inspector — with a slim command bar above and a status rail below. */
:root{
  --desk:#e3e7ea; --chrome:#f4f6f7; --chrome-2:#e9edef; --paper:#ffffff; --ink:#1b2227; --muted:#515d67; --faint:#6e7a84;
  --line:#d2d9de; --line-2:#e5e9ec; --hover:rgba(23,94,89,.07);
  --accent:#16645f; --accent-2:#1d7f78; --accent-ink:#ffffff; --accent-soft:#d6ebe8; --sel:#cde5e1;
  --danger:#b3262f; --warn:#9a5b00; --ok:#2e7a35;
  --cmt-bg:rgba(233,180,40,.22); --cmt-line:#d9a21b;
  --hl-adverb:rgba(240,176,40,.38); --hl-passive:rgba(150,95,210,.28); --hl-filter:rgba(55,135,215,.26);
  --hl-weak:rgba(130,140,150,.30); --hl-cliche:rgba(225,85,95,.28); --hl-tags:rgba(30,160,140,.28);
  --hl-long:#c2414b; --hl-echo:#2f6fb0; --hl-find:rgba(255,210,0,.45); --hl-find-cur:rgba(255,140,0,.6);
  --shadow:0 1px 2px rgba(16,28,36,.06),0 10px 30px rgba(16,28,36,.09);
  --pop:0 8px 30px rgba(16,28,36,.18),0 1px 3px rgba(16,28,36,.1);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata","Iowan Old Style",Georgia,serif;
  --ed-font:var(--serif); --ed-size:18px; --ed-lh:1.7; --ed-width:720px; --zoom:1;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-folio-theme]){
    --desk:#121619; --chrome:#181d21; --chrome-2:#20262b; --paper:#1d2327; --ink:#dde3e7; --muted:#a6b1b9; --faint:#86919a;
    --line:#2c343a; --line-2:#252c31; --hover:rgba(110,200,190,.08);
    --accent:#5cbcb2; --accent-2:#79cec5; --accent-ink:#0d1a19; --accent-soft:#1d3634; --sel:#24403d;
    --danger:#ef6b72; --warn:#e0a24a; --ok:#6cc073;
    --cmt-bg:rgba(233,180,40,.18); --cmt-line:#b88a1a;
    --hl-adverb:rgba(240,176,40,.28); --hl-passive:rgba(170,120,230,.28); --hl-filter:rgba(80,160,235,.26);
    --hl-weak:rgba(160,170,180,.22); --hl-cliche:rgba(240,100,110,.28); --hl-tags:rgba(40,190,165,.25);
    --hl-long:#ef6b72; --hl-echo:#6aa8e8; --hl-find:rgba(255,210,0,.3); --hl-find-cur:rgba(255,140,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --pop:0 10px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-folio-theme]),:root[data-folio-theme="dark"]{
  --desk:#121619; --chrome:#181d21; --chrome-2:#20262b; --paper:#1d2327; --ink:#dde3e7; --muted:#a6b1b9; --faint:#86919a;
  --line:#2c343a; --line-2:#252c31; --hover:rgba(110,200,190,.08);
  --accent:#5cbcb2; --accent-2:#79cec5; --accent-ink:#0d1a19; --accent-soft:#1d3634; --sel:#24403d;
  --danger:#ef6b72; --warn:#e0a24a; --ok:#6cc073;
  --cmt-bg:rgba(233,180,40,.18); --cmt-line:#b88a1a;
  --hl-adverb:rgba(240,176,40,.28); --hl-passive:rgba(170,120,230,.28); --hl-filter:rgba(80,160,235,.26);
  --hl-weak:rgba(160,170,180,.22); --hl-cliche:rgba(240,100,110,.28); --hl-tags:rgba(40,190,165,.25);
  --hl-long:#ef6b72; --hl-echo:#6aa8e8; --hl-find:rgba(255,210,0,.3); --hl-find-cur:rgba(255,140,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --pop:0 10px 34px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-folio-theme="sepia"]{
  --desk:#e7dfd1; --chrome:#f3ede2; --chrome-2:#ebe3d5; --paper:#fbf6ec; --ink:#33291f; --muted:#655746; --faint:#837461;
  --line:#d8cdb9; --line-2:#e6dccb; --hover:rgba(110,80,40,.07);
  --accent:#3f6a5c; --accent-2:#4d7e6e; --accent-soft:#dfe6d8; --sel:#e2dcc3; color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.45 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.ic{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- app frame ---------- */
.app{display:flex;flex-direction:column;height:100%}
.app>.workspace{flex:1;min-height:0}
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.wordmark{font:italic 600 19px/1 var(--serif);letter-spacing:-.01em;color:var(--accent);background:none;border:0;padding:4px 6px;border-radius:var(--r)}
.wordmark:hover{background:var(--hover)}
.proj-title{border:0;background:none;font-weight:600;padding:5px 8px;border-radius:var(--r);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-title:hover{background:var(--hover)}
.spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding:0 8px;border:0;border-radius:var(--r);background:none;color:var(--muted);white-space:nowrap}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn .lbl{font-size:13px;font-weight:500}
.seg{display:inline-flex;background:var(--chrome-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* formatting toolbar */
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 10px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.tb{height:30px;min-width:30px;border:0;background:none;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none;padding:0 6px}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.txt{font-family:var(--serif);font-size:15px;width:30px}
.tsel{height:28px;border:1px solid var(--line);background:var(--paper);border-radius:5px;padding:0 6px;flex:none;font-size:13px}
.tcolor{position:relative;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
.tcolor:hover{background:var(--hover)}
.tcolor input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.tcolor .sw{position:absolute;left:7px;right:7px;bottom:5px;height:3px;border-radius:2px}
.tcolor b{font:600 15px var(--serif);margin-top:-4px}

/* panes */
.workspace{display:grid;grid-template-columns:var(--binder-w,264px) minmax(0,1fr) 336px;min-height:0;position:relative}
.workspace.no-binder{grid-template-columns:0 minmax(0,1fr) 336px}
.workspace.no-insp{grid-template-columns:var(--binder-w,264px) minmax(0,1fr) 0}
.workspace.no-binder.no-insp{grid-template-columns:0 minmax(0,1fr) 0}
.binder,.inspector{background:var(--chrome);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.binder{border-right:1px solid var(--line);grid-column:1;grid-row:1}
.center-wrap{grid-column:2;grid-row:1}
.inspector{grid-column:3;grid-row:1}
.inspector{border-left:1px solid var(--line)}
.no-binder .binder,.no-insp .inspector{border:0}
.pane-h{display:flex;align-items:center;gap:6px;padding:8px 10px 6px}
.pane-h input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:var(--r);padding:0 8px;background:var(--paper)}
.tree{flex:1;overflow:auto;padding:2px 6px 12px}
.row{display:flex;align-items:center;gap:6px;height:30px;padding-right:6px;border-radius:5px;cursor:default;user-select:none;position:relative;color:var(--ink)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row .tw{width:18px;height:18px;border:0;background:none;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--faint);transition:transform .12s}
.row .tw.open{transform:rotate(90deg)}
.row .tw:empty{visibility:hidden}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ic{color:var(--muted)}
.row.root{font-weight:600;margin-top:6px}
.row.root .ic{color:var(--accent)}
.row.excluded .t{color:var(--faint);text-decoration:line-through}
.row .dot{width:8px;height:8px;border-radius:50%;flex:none}
.row .wc{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.row .more{opacity:0;width:22px;height:22px;border:0;background:none;color:var(--muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.row:hover .more,.row.sel .more{opacity:1}
.row .more:hover{background:var(--hover)}
.row input.rename{flex:1;min-width:0;height:24px;border:1px solid var(--accent);border-radius:4px;padding:0 4px;background:var(--paper)}
.row.drop-before::before,.row.drop-after::after{content:"";position:absolute;left:8px;right:4px;height:2px;background:var(--accent);border-radius:2px}
.row.drop-before::before{top:-1px}.row.drop-after::after{bottom:-1px}
.row.drop-inside{box-shadow:inset 0 0 0 2px var(--accent)}
.binder-f{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.binder-f .icon-btn{flex:1}

/* center */
.center-wrap{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.panes{flex:1;display:flex;min-height:0}
.center{flex:1;overflow:auto;min-height:0;min-width:0;scroll-behavior:auto}
.split{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--desk)}
.split-head{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 12px;background:var(--chrome);border-bottom:1px solid var(--line);color:var(--muted);min-height:38px}
.split-title{border:0;background:none;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-title:hover{background:var(--hover)}
.split-title .ic{transform:rotate(90deg);color:var(--faint)}
.split-head .spacer{flex:1}
.split-body{flex:1;overflow:auto;min-height:0}
.split .desk{padding:24px 14px 30vh}
.split .paper{padding:calc(40px * var(--zoom)) calc(44px * var(--zoom))}
.speakbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:4px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:6px 10px;width:max-content;max-width:calc(100% - 24px)}
.speakbar .sb-voice{max-width:150px}
.speakbar select{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:12px;max-width:190px}
.speakbar .sb-count{font-size:12px;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
body.focus .split{display:none}
.assist-promise{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--muted);background:var(--accent-soft);border-radius:var(--r);padding:8px 10px}
.assist-promise .ic{color:var(--accent);margin-top:1px}
.assist-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.assist-grid .btn{white-space:normal;height:auto;min-height:32px;padding:4px 8px;line-height:1.25;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-direction:column;gap:6px}
.check{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;font-size:12.5px;line-height:1.4;display:flex;flex-direction:column;gap:3px}
.ck-kind{font:600 10px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.ck-acts{display:flex;gap:2px;margin-left:-4px}
.assist-out{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ao-h{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ao-body{font-size:13px;line-height:1.5}
.ao-body p{margin:0 0 6px}.ao-body ul{margin:0 0 6px;padding-left:18px}.ao-body li{margin-bottom:4px}
.ao-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ai-setup{border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.ai-setup summary{cursor:pointer;font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ai-setup[open]{display:flex}
.ai-help p,.ai-help ol{margin:0 0 6px}.ai-help ol{padding-left:18px}
.ai-help code,.hint code{font:11.5px var(--mono);background:var(--chrome-2);padding:1px 4px;border-radius:3px;word-break:break-all}
.safe-row{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px}
.safe-row .ic{color:var(--accent);margin-top:2px}
@media (max-width:900px){.split{display:none!important}#b-split{display:none}}
.banner{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.banner .btn{height:28px}
.desk{padding:36px 20px 40vh}
.paper{max-width:calc(var(--ed-width) * var(--zoom));margin:0 auto;background:var(--paper);box-shadow:var(--shadow);border-radius:2px;padding:calc(64px * var(--zoom)) calc(80px * var(--zoom));min-height:calc(100% - 20px);font-size:calc(var(--ed-size) * var(--zoom))}
.desk.flat .paper{background:transparent;box-shadow:none;padding-top:24px}
.doc-title{display:block;width:100%;border:0;background:none;font:600 1.6em/1.2 var(--ed-font);color:var(--ink);padding:0;margin:0 0 .3em;letter-spacing:-.01em}
.doc-title:focus{outline:none}
.doc-meta{font:12px var(--ui);color:var(--faint);margin-bottom:2.2em;display:flex;gap:12px;flex-wrap:wrap}
.ed{font-family:var(--ed-font);font-size:1em;line-height:var(--ed-lh);color:var(--ink);outline:none;min-height:8em;caret-color:var(--accent);overflow-wrap:break-word}
.ed p{margin:0;text-indent:1.6em}
.ed>p:first-child,.ed h1+p,.ed h2+p,.ed h3+p,.ed hr+p,.ed blockquote+p,.ed ul+p,.ed ol+p{text-indent:0}
.blocky .ed p{text-indent:0;margin:0 0 .9em}
.ed li p{text-indent:0}
.ed p.is-editor-empty:first-child::before{content:attr(data-placeholder);color:var(--faint);float:left;height:0;pointer-events:none;text-indent:0}
.ed hr.ProseMirror-selectednode{outline:2px solid var(--accent);outline-offset:2px}
.ed h1,.ed h2,.ed h3{font-family:var(--ed-font);line-height:1.25;margin:1.2em 0 .6em;text-indent:0}
.ed h1{font-size:1.6em;font-weight:600}.ed h2{font-size:1.3em;font-weight:600}.ed h3{font-size:1.1em;font-weight:600;font-style:italic}
.ed blockquote{margin:1em 2em;font-style:italic}
.ed blockquote p{text-indent:0}
.ed ul,.ed ol{margin:.6em 0 .6em 1.4em;padding-left:1em}
.ed hr{border:0;height:1.6em;margin:1.2em 0;text-align:center;overflow:visible}
.ed hr::after{content:"#";color:var(--faint);font-family:var(--ed-font)}
.ed .cmt{background:var(--cmt-bg);border-bottom:2px solid var(--cmt-line);cursor:pointer}
.ed .cmt.flash{background:var(--cmt-line)}
.dim .ed>*{opacity:.32;transition:opacity .25s}
.dim .ed>.has-focus{opacity:1}
.ed-lazy .ed{opacity:.92}
.ro-note{display:flex;align-items:center;gap:6px;font:12px var(--ui);color:var(--muted);background:var(--chrome-2);border-radius:var(--r);padding:6px 10px;margin-bottom:14px}
::highlight(speak){background-color:var(--accent-soft);color:var(--ink)}
.ed[contenteditable="false"]{cursor:default}
.comp-head{display:flex;align-items:baseline;gap:10px;margin:2.6em 0 1em;font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.comp-head:first-child{margin-top:0}
.comp-head button{border:0;background:none;color:var(--faint);font:inherit;letter-spacing:inherit;padding:0;text-transform:inherit}
.comp-head button:hover{color:var(--accent)}
.comp-head::after{content:"";flex:1;border-bottom:1px dashed var(--line)}
.comp-folder{font:600 1.35em/1.3 var(--ed-font);margin:2em 0 .4em;text-align:center}
.sheet{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0 0 2.2em;font-size:14px}
.sheet label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.sheet textarea{font:15px/1.45 var(--ui);text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);border:1px solid var(--line-2);background:transparent;border-radius:var(--r);padding:6px 8px;resize:none;overflow:hidden;min-height:34px}
.sheet textarea:focus{border-color:var(--accent);outline:none}
.sheet .wide{grid-column:1/-1}
.sheet-h{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.notes-h{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;padding-top:14px;border-top:1px solid var(--line-2)}

::highlight(find){background-color:var(--hl-find)}
::highlight(find-cur){background-color:var(--hl-find-cur)}
::highlight(pol-adverb){background-color:var(--hl-adverb)}
::highlight(pol-passive){background-color:var(--hl-passive)}
::highlight(pol-filter){background-color:var(--hl-filter)}
::highlight(pol-weak){background-color:var(--hl-weak)}
::highlight(pol-cliche){background-color:var(--hl-cliche)}
::highlight(pol-tags){background-color:var(--hl-tags)}
::highlight(pol-long){text-decoration:underline wavy var(--hl-long);text-decoration-thickness:1px}
::highlight(pol-echo){text-decoration:underline dotted var(--hl-echo);text-decoration-thickness:2px}

/* empty states */
.empty{max-width:440px;margin:12vh auto;text-align:center;color:var(--muted);padding:0 16px}
.empty h3{font:600 20px var(--serif);color:var(--ink);margin:0 0 8px}
.empty .btn{margin-top:14px}

/* corkboard */
.view-pad{padding:24px clamp(14px,3vw,36px) 80px}
.view-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.view-h h2{font:600 24px/1.2 var(--serif);margin:0;letter-spacing:-.01em}
.view-h .sub{color:var(--muted);font-size:13px}
.view-h .spacer{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--paper);border-radius:4px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:190px;position:relative;overflow:hidden;border:1px solid var(--line-2)}
.card.dragging{opacity:.4}
.card.drop-l{box-shadow:-4px 0 0 var(--accent),var(--shadow)}
.card.drop-r{box-shadow:4px 0 0 var(--accent),var(--shadow)}
.card-strip{height:5px;flex:none}
.card-title{border:0;background:none;font:600 15px var(--ui);padding:10px 12px 4px;border-bottom:1px solid var(--line-2);margin:0 4px}
.card-title:focus{outline:none;border-bottom-color:var(--accent)}
.card-syn{flex:1;border:0;background:repeating-linear-gradient(transparent 0 23px,var(--line-2) 23px 24px);background-position:0 6px;font:14px/24px var(--serif);padding:6px 12px;resize:none;min-height:110px;color:var(--ink)}
.card-syn:focus{outline:none}
.card-foot{display:flex;align-items:center;gap:8px;padding:6px 10px 8px;font-size:11px;color:var(--faint)}
.card-foot .spacer{flex:1}
.stamp{font:600 10px var(--ui);letter-spacing:.07em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:1px 5px;color:var(--muted)}
.stamp.s-Done,.stamp.s-Final{color:var(--ok)}
.stamp.s-Revised{color:var(--accent)}
.stamp.s-First{color:var(--warn)}
.card .open{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px}
.card .open:hover{background:var(--hover)}
.card .kind{position:absolute;top:12px;right:10px;color:var(--faint)}
.add-card{border:2px dashed var(--line);border-radius:4px;background:none;min-height:190px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:500}
.add-card:hover{border-color:var(--accent);color:var(--accent)}

/* outline */
.tbl-wrap{overflow-x:auto;background:var(--paper);border-radius:6px;box-shadow:var(--shadow)}
table.outline{width:100%;border-collapse:collapse;min-width:820px;font-size:13px}
.outline th{text-align:left;font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--paper)}
.outline td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.outline tr.folder td{background:var(--chrome)}
.outline tr.folder .o-title{font-weight:600}
.outline input,.outline textarea,.outline select{width:100%;border:1px solid transparent;background:none;border-radius:4px;padding:3px 5px}
.outline input:hover,.outline textarea:hover,.outline select:hover{border-color:var(--line)}
.outline input:focus,.outline textarea:focus{border-color:var(--accent);outline:none;background:var(--paper)}
.outline textarea{resize:none;overflow:hidden;min-height:26px;font-family:var(--serif);font-size:13.5px;line-height:1.4}
.o-title-cell{display:flex;align-items:center;gap:6px}
.o-title-cell .ic{color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:5px;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px}
.outline tfoot td{font-weight:600;border-bottom:0;padding:10px 8px}

/* story map */
.map-wrap{overflow:auto;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);max-height:calc(100vh - 230px)}
table.map{border-collapse:separate;border-spacing:0;font-size:12px}
.map th,.map td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.map thead th{position:sticky;top:0;background:var(--paper);z-index:2;vertical-align:bottom;padding:8px 6px;min-width:96px;max-width:120px;text-align:left;font-weight:500}
.map thead th .ch{display:block;font:600 10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map thead th button{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.map thead th button:hover{color:var(--accent)}
.map tbody th,.map thead th:first-child{position:sticky;left:0;background:var(--paper);z-index:1;text-align:left;padding:6px 10px;white-space:nowrap;font-weight:600;min-width:170px}
.map thead th:first-child{z-index:3}
.map .grp th{background:var(--chrome);font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.map .grp td{background:var(--chrome)}
.map td{padding:0;height:34px;text-align:center}
.map td button{width:100%;height:34px;border:0;background:none;display:flex;align-items:center;justify-content:center}
.map td button:hover{background:var(--hover)}
.map .pill{display:block;height:14px;width:calc(100% - 10px);border-radius:7px}
.map .pov{font:700 9px var(--ui);letter-spacing:.06em;color:var(--paper);border-radius:7px;padding:2px 6px}
.map .wbar{display:flex;align-items:flex-end;justify-content:center;height:34px;padding:4px 0}
.map .wbar i{width:16px;background:var(--accent);opacity:.6;border-radius:2px 2px 0 0}
.sw-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}

/* inspector */
.tabs{display:flex;flex-direction:column;gap:8px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.insp-groups{display:flex}
.insp-groups button{flex:1;justify-content:center;padding:6px 10px}
.insp-sub{display:flex;gap:4px;overflow-x:auto}
.insp-sub button{border:0;background:none;padding:6px 6px 9px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.insp-sub button:hover{color:var(--ink)}
.insp-sub button.on{color:var(--ink);border-bottom-color:var(--accent)}
.insp-sub button .n{font-size:10px;background:var(--chrome-2);border-radius:8px;padding:0 5px;margin-left:3px}
.insp-body{flex:1;overflow:auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span,.lbl-sm{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea,.inp{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:6px 8px;min-height:32px}
.fld textarea{resize:vertical;min-height:80px;line-height:1.45}
.fld textarea.serif{font:14.5px/1.5 var(--serif)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:3px 10px 3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.meta-list{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.meta-list b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.cmt-card{border:1px solid var(--line);border-left:3px solid var(--cmt-line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.cmt-card.flash{box-shadow:0 0 0 2px var(--cmt-line)}
.cmt-card q{font:italic 13px/1.4 var(--serif);color:var(--muted);quotes:"“" "”"}
.cmt-card textarea{border:0;background:none;resize:none;min-height:40px;padding:0;font-size:13px;line-height:1.45;overflow:hidden}
.cmt-card textarea:focus{outline:none}
.cmt-card .foot{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--faint)}
.cmt-card .foot .spacer{flex:1}
.link-btn{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px}
.link-btn:hover{background:var(--hover)}
.link-btn.danger{color:var(--danger)}
.snap{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.snap .nm{font-weight:600;font-size:13px}
.snap .dt{font-size:11.5px;color:var(--faint)}
.snap .acts{display:flex;gap:2px;margin-left:-4px}
.pol-cat{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0}
.pol-cat .sw{width:14px;height:14px;border-radius:3px;flex:none}
.pol-cat .sw.u{background:none!important;border-bottom:2px solid}
.pol-cat .nm{flex:1;border:0;background:none;text-align:left;padding:0}
.pol-cat .nm:hover{color:var(--accent)}
.pol-cat .ct{font-variant-numeric:tabular-nums;font-weight:600;min-width:24px;text-align:right}
.pol-cat input{accent-color:var(--accent)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px}
.stat b{display:block;font:600 18px var(--ui);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.overused{display:flex;flex-wrap:wrap;gap:4px}
.overused span{background:var(--chrome-2);border-radius:4px;padding:2px 6px;font-size:12px}

/* status bar */
.statusbar{display:flex;align-items:center;gap:16px;padding:4px 12px;background:var(--chrome);border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-height:30px;overflow:hidden;white-space:nowrap}
.statusbar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.st-prog{display:flex;align-items:center;gap:8px;min-width:0}
.st-prog .bar{width:120px;margin:0}
.st-btn{border:0;background:none;color:inherit;padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.st-btn:hover{background:var(--hover);color:var(--ink)}
.st-save.err{color:var(--danger);font-weight:600}
.ring{--p:0;width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:inline-block;position:relative}
.ring::after{content:"";position:absolute;inset:3px;background:var(--chrome);border-radius:50%}
.zoom{height:22px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:12px;padding:0 2px}

/* find bar */
.findbar{position:absolute;top:10px;right:18px;z-index:20;background:var(--chrome);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);padding:10px;width:min(380px,calc(100% - 24px));display:flex;flex-direction:column;gap:8px}
.findbar .fr{display:flex;gap:6px;align-items:center}
.findbar input[type=text]{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:5px;padding:0 8px;background:var(--paper)}
.findbar .cnt{font-size:12px;color:var(--muted);min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.findbar .opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}
.findbar select{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:12px}
.f-results{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px}
.f-results button{border:0;background:none;text-align:left;padding:6px 8px;border-radius:5px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.f-results button:hover{background:var(--hover)}
.f-results .ft{font-weight:600}
.f-results .fs{color:var(--muted);font-family:var(--serif)}
.f-results mark{background:var(--hl-find);color:inherit}

/* buttons */
.btn{height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--danger)}
.btn.primary.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}

/* modal, menu, toast */
.modal-back{position:fixed;inset:0;background:rgba(10,16,20,.42);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:100;overflow:auto}
.modal{background:var(--chrome);border-radius:10px;box-shadow:var(--pop);width:min(520px,100%);display:flex;flex-direction:column;max-height:88vh}
.modal.wide{width:min(980px,100%)}
.modal-h{display:flex;align-items:center;padding:14px 16px 10px 20px;gap:10px}
.modal-h h2{flex:1;margin:0;font:600 18px var(--ui)}
.modal-b{padding:4px 20px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.menu{position:fixed;z-index:200;background:var(--chrome);border:1px solid var(--line);border-radius:8px;box-shadow:var(--pop);padding:5px;min-width:210px;max-width:300px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px;font-size:13px}
.menu button:hover,.menu button:focus{background:var(--hover);outline:none}
.menu button.danger{color:var(--danger)}
.menu button .k{margin-left:auto;font-size:11px;color:var(--faint)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
.toasts{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:300;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--pop);max-width:90vw}
.toast.update{pointer-events:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toast.update .btn:not(.primary){background:transparent;color:inherit;border-color:color-mix(in srgb,currentColor 40%,transparent)}

/* export */
.exp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;min-height:0}
.exp-opts{display:flex;flex-direction:column;gap:12px}
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fmt-grid button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:8px;text-align:left;display:flex;flex-direction:column;gap:1px}
.fmt-grid button b{font-size:13px}
.fmt-grid button span{font-size:11px;color:var(--muted)}
.fmt-grid button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.preview{background:var(--desk);border-radius:8px;padding:18px;overflow:auto;max-height:60vh;min-height:300px}
.pv-page{background:#fff;color:#111;box-shadow:var(--shadow);margin:0 auto 16px;max-width:560px;padding:48px 52px;font-size:11px;line-height:1.5;min-height:300px}
.pv-page p{margin:0;text-indent:2em}
.pv-page .ch{text-align:center;margin:40px 0 24px;font-size:14px}
.pv-page .pt{text-align:center;margin:60px 0;font-size:16px}
.pv-page .sb{text-align:center;margin:10px 0}
.pv-page .noind,.pv-page .ch+p,.pv-page .sb+p{text-indent:0}
.pv-page blockquote{margin:6px 24px}
.pv-page .tp{display:flex;justify-content:space-between;font-size:10px;line-height:1.3;margin-bottom:120px}
.pv-page .tt{text-align:center;font-size:15px}
.pv-page .pvhead{text-align:right;font-size:9px;color:#666;margin:-28px 0 18px}

/* home */
.home{height:100%;overflow:auto;background:var(--desk)}
.home-in{max-width:1040px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 80px}
.home-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.home-top .wordmark{font-size:34px;padding:0}
.home-tag{color:var(--muted);font-size:15px;margin:0 0 30px;max-width:620px}
.home h3{font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.pcard{background:var(--paper);border:1px solid var(--line-2);border-radius:6px;box-shadow:var(--shadow);padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-height:170px;position:relative}
.pcard:hover{border-color:var(--accent)}
.pcard .pt{font:600 19px/1.25 var(--serif);margin:0;padding-right:28px}
.pcard .pm{font-size:12px;color:var(--muted)}
.pcard .spacer{flex:1}
.pcard .bar{margin:0}
.pcard .more{position:absolute;top:10px;right:8px}
.pcard.new{border:2px dashed var(--line);box-shadow:none;background:none;align-items:center;justify-content:center;color:var(--muted);font-weight:500}
.tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tmpl-grid button{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.tmpl-grid button b{font-size:13.5px}
.tmpl-grid button span{font-size:12px;color:var(--muted);line-height:1.35}
.tmpl-grid button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.why{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.why div{background:var(--chrome);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.5}
.why b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}

/* goals chart */
.goal-big{display:flex;gap:18px;flex-wrap:wrap}
.goal-big .stat{flex:1;min-width:130px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--ui)}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
kbd{font:11.5px var(--mono);background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;white-space:nowrap}
.qo-list{display:flex;flex-direction:column;gap:1px;max-height:50vh;overflow:auto}
.qo-list button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px;display:flex;gap:10px;align-items:center}
.qo-list button.on,.qo-list button:hover{background:var(--sel)}
.qo-list .path{margin-left:auto;font-size:11.5px;color:var(--faint)}

/* focus mode */
body.focus .topbar,body.focus .toolbar,body.focus .statusbar,body.focus .binder,body.focus .inspector{display:none}
body.focus .workspace{grid-template-columns:0 minmax(0,1fr) 0}
body.focus .paper{box-shadow:none;background:transparent}
body.focus .desk{padding-top:12vh}
.focus-hud{position:fixed;bottom:max(14px,env(safe-area-inset-bottom,0px));right:18px;z-index:50;font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center;opacity:.55;transition:opacity .2s}
.focus-hud:hover{opacity:1}

@media (max-width:1400px){
  .workspace,.workspace.no-binder{grid-template-columns:var(--binder-w,250px) minmax(0,1fr) 0}
  .workspace.no-binder{grid-template-columns:0 minmax(0,1fr) 0}
  .workspace .inspector{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);z-index:30;box-shadow:var(--pop);border:0}
  .workspace.no-insp .inspector{display:none}
}
@media (max-width:1360px){.tgrp .lbl{display:none}}
@media (max-width:1100px){
  .topbar .lbl{display:none}
}
@media (max-width:760px){
  .workspace,.workspace.no-insp,.workspace.no-binder{grid-template-columns:0 minmax(0,1fr) 0}
  .workspace .binder{position:absolute;left:0;top:0;bottom:0;width:min(300px,88vw);z-index:30;box-shadow:var(--pop);border:0}
  .workspace.no-binder .binder{display:none}
  .paper{padding:28px 18px}
  .desk{padding:12px 8px 40vh}
  .proj-title{max-width:120px}
  .seg button .lbl{display:none}
  .statusbar .hide-sm{display:none}
  .exp{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr}
  .wordmark.top{display:none}
  #b-goals,#b-theme,.topbar .seg button[title="Story map"]{display:none}
  .topbar{gap:2px;padding:6px}
  .proj-title{max-width:90px;padding:5px 4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{body{overflow:visible}}

/* ---------- guide panel ---------- */
:root{--guide-w:380px}
body.guide-open #app,body.guide-open #home{margin-right:var(--guide-w)}
.guide{position:fixed;top:0;right:0;bottom:0;width:var(--guide-w);z-index:90;background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.06)}
.guide-h{padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.guide-title{display:flex;align-items:center;gap:8px;color:var(--accent)}
.guide-title b{color:var(--ink);font-size:15px}
.guide-search{width:100%}
.guide-body{flex:1;overflow:auto;padding:14px 16px 40px}
.guide-hero{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.guide-hero h2{margin:0 0 6px;font:600 20px/1.2 var(--serif);color:var(--accent)}
.guide-hero p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.guide-hero-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.guide-toc{display:flex;flex-direction:column;gap:2px}
.guide-toc-row{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:8px 8px;border-radius:8px;color:var(--ink);width:100%}
.guide-toc-row:hover{background:var(--hover)}
.guide-toc-row .gt-num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--chrome-2);color:var(--muted)}
.guide-toc-row.read .gt-num{background:var(--accent-soft);color:var(--accent)}
.guide-toc-row .gt-text{flex:1;min-width:0;display:flex;flex-direction:column}
.guide-toc-row .gt-text span{font-size:12px;color:var(--muted)}
.guide-toc-row>svg{color:var(--faint);flex:none}
.guide-back{margin:-4px 0 8px -4px}
.guide-kicker{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px}
.guide-ch-h h2{margin:0 0 4px;font:600 22px/1.2 var(--serif)}
.guide-ch-h p{margin:0 0 12px;color:var(--muted)}
.guide-show{margin-bottom:6px}
.guide-sec{margin-top:18px}
.guide-sec h3{margin:0 0 6px;font-size:14.5px}
.guide-text{line-height:1.55;color:var(--ink)}
.guide-text p{margin:0 0 8px}
.guide-text ul,.guide-text ol{margin:0 0 8px;padding-left:20px}
.guide-text li{margin:3px 0}
.guide-text code{font:12.5px var(--mono);background:var(--chrome-2);padding:1px 4px;border-radius:4px}
.guide-tip{display:flex;gap:8px;background:var(--accent-soft);border-radius:8px;padding:9px 11px;margin-top:8px;line-height:1.5;font-size:13px}
.guide-tip b{color:var(--accent);flex:none}
.guide-keys{margin-top:12px}
.guide-nav{display:flex;justify-content:space-between;gap:8px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.guide-nav .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guide-hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:8px;color:var(--ink)}
.guide-hit:hover{background:var(--hover)}
.guide-hit .gh-ch{font-size:11px;color:var(--accent);font-weight:600}
.guide-hit .gh-snip{font-size:12px;color:var(--muted)}
.welcome p{margin:0 0 10px;line-height:1.55}
body.guide-open .topbar .icon-btn .lbl{display:none}
body.guide-open .seg button{white-space:nowrap}
@media (max-width:1300px){body.guide-open .seg .lbl{display:none}}
@media (max-width:1100px){:root{--guide-w:340px}}
body.guide-open .tgrp .lbl{display:none}
@media (max-width:900px){body.guide-open #app,body.guide-open #home{margin-right:0}.guide{width:100%;left:0;border-left:0}}
@media (max-width:760px){#b-help{display:none}}

/* ---------- guided tour ---------- */
.tour-back{position:fixed;inset:0;z-index:200}
.tour-hole{position:fixed;z-index:201;border-radius:10px;box-shadow:0 0 0 2px var(--accent),0 0 0 9999px rgba(10,20,22,.5);pointer-events:none;transition:all .25s ease}
.tour-pop{position:fixed;z-index:202;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);padding:14px 16px 12px;width:340px;transition:left .25s ease,top .25s ease}
.tour-pop h3{margin:2px 0 6px;font:600 17px/1.25 var(--serif);color:var(--accent)}
.tour-count{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tour-text{line-height:1.55;font-size:13.5px}
.tour-f{display:flex;align-items:center;gap:6px;margin-top:12px}
.share-box{display:flex;flex-direction:column;gap:12px}
.share-box p{margin:0;line-height:1.5}
.share-row{display:flex;gap:8px}
.share-row .inp{flex:1;min-width:0}

/* ---------- calmer chrome ---------- */
.tgrp{display:flex;align-items:center;gap:2px;padding-left:6px;margin-left:2px;border-left:1px solid var(--line)}
.tgrp:first-of-type{border-left:0}
.toolbar{position:relative}
.toolbar .tb-grp{display:flex;align-items:center;gap:2px;flex:none}
.aa-btn{gap:2px;padding:0 6px 0 8px}
.aa-glyph{font:600 14px var(--serif);letter-spacing:-.02em}
.aa-panel{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:10px 12px;display:flex;flex-direction:column;gap:6px;width:max-content;max-width:calc(100vw - 16px)}
.aa-panel[hidden]{display:none}
.aa-row{display:flex;align-items:center;gap:10px}
.aa-l{width:58px;flex:none;font-size:12px;font-weight:600;color:var(--muted)}
.aa-c{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tb.txt-sm{font-size:12.5px;padding:0 8px;border:1px solid var(--line)}
.fmt-bubble{position:fixed;z-index:70;display:flex;align-items:center;gap:1px;background:var(--ink);color:var(--paper);border-radius:9px;padding:3px;box-shadow:var(--pop)}
.fmt-bubble[hidden]{display:none}
.fmt-bubble .tb{color:var(--paper);height:30px}
.fmt-bubble .tb:hover{background:color-mix(in srgb,var(--paper) 16%,transparent)}
.fmt-bubble .tb.on{background:color-mix(in srgb,var(--paper) 24%,transparent);color:var(--paper)}
.fmt-bubble .sep{width:1px;height:18px;background:color-mix(in srgb,var(--paper) 30%,transparent);margin:0 3px}
.fmt-bubble .hl-glyph{font:600 15px var(--serif);background:#fff1a8;color:#1b2227;padding:0 4px;border-radius:3px}
.seg.choice{align-self:flex-start;flex-wrap:wrap}
.seg.choice button{padding:5px 12px}

/* quiet writing */
.topbar,.toolbar,.binder,.inspector,.statusbar,.split-head{transition:opacity .3s ease}
body.quiet .topbar,body.quiet .toolbar,body.quiet .binder,body.quiet .inspector,body.quiet .statusbar,body.quiet .split-head{opacity:0;transition:opacity 1.2s ease}

/* interface size */
:root[data-ui="large"] :is(.topbar,.toolbar,.binder,.inspector,.statusbar,.modal,.home-in,.guide-h,.guide-body,.findbar,.split-head){zoom:1.12}
:root[data-ui="small"] :is(.topbar,.toolbar,.binder,.inspector,.statusbar,.modal,.home-in,.guide-h,.guide-body,.findbar,.split-head){zoom:.92}
@media (max-width:760px){
  #b-find,#b-export{display:none}
  .tgrp{border-left:0;padding-left:0;margin-left:0}
  .proj-title{max-width:130px}
}

/* celebrations */
.cel{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:320;display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 10px 12px 14px;box-shadow:var(--pop);max-width:min(440px,calc(100vw - 32px));animation:cel-in .5s cubic-bezier(.2,.9,.3,1.2) both;overflow:visible}
.cel.out{animation:cel-out .45s ease both}
.cel-art svg{width:40px;height:40px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
.cel-art .fill{fill:color-mix(in srgb,var(--accent) 25%,transparent)}
.cel-art .rays{transform-origin:24px 24px;animation:cel-spin 6s linear infinite}
.cel-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.cel-txt b{font-family:var(--serif,Georgia,serif);font-size:17px;font-weight:600}
.cel-txt span{font-size:13px;color:var(--muted)}
.cel.big{padding:16px 12px 16px 18px}
.cel.big .cel-txt b{font-size:20px}
.cel-conf{position:absolute;inset:0;pointer-events:none}
.cel-conf i{position:absolute;top:0;width:7px;height:10px;border-radius:2px;background:var(--accent);opacity:0;animation:cel-conf 1.8s ease-out forwards}
.cel-conf i:nth-child(3n){background:var(--warn)}.cel-conf i:nth-child(3n+1){background:var(--accent-2)}
@keyframes cel-in{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes cel-out{to{opacity:0;transform:translate(-50%,10px)}}
@keyframes cel-spin{to{transform:rotate(360deg)}}
@keyframes cel-conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),-120px) rotate(var(--r))}}
.ring.done{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ring.glow{animation:ring-glow 1.6s ease 3}
@keyframes ring-glow{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 30%,transparent)}}
body.quiet .cel{opacity:1}
@media (prefers-reduced-motion:reduce){.cel,.cel.out,.cel-art .rays,.ring.glow{animation:none}}

</style>
</head>
<body>
<div id="home" class="home" hidden></div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="b-binder" title="Show or hide the binder" aria-label="Toggle binder"></button>
    <button class="wordmark top" id="b-home" title="All projects">Folio</button>
    <button class="proj-title" id="b-ptitle" title="Rename project"></button>
    <span class="spacer"></span>
    <div class="seg" id="viewseg" role="tablist" aria-label="View"></div>
    <span class="spacer"></span>
    <div class="tgrp" role="group" aria-label="Writing tools">
      <button class="icon-btn" id="b-find" title="Find and replace (Ctrl+F)"></button>
      <button class="icon-btn" id="b-split" title="Split view: two documents side by side"></button>
      <button class="icon-btn" id="b-focus" title="Focus mode (Ctrl+Shift+F)"></button>
    </div>
    <div class="tgrp" role="group" aria-label="Project">
      <button class="icon-btn" id="b-goals" title="Goals and writing history"></button>
      <button class="icon-btn" id="b-export" title="Export your manuscript"></button>
      <button class="icon-btn" id="b-install" title="Install Folio as an app on this computer" hidden></button>
    </div>
    <div class="tgrp" role="group" aria-label="Panels and help">
      <button class="icon-btn" id="b-help" title="Guide and tutorial (F1)" aria-label="Guide and tutorial"></button>
      <button class="icon-btn" id="b-insp" title="Show or hide the inspector"></button>
      <button class="icon-btn" id="b-more" title="More" aria-label="More"></button>
    </div>
  </header>

  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting"></div>

  <main class="workspace" id="ws">
    <aside class="binder" aria-label="Binder">
      <div class="pane-h"><input id="binder-filter" type="text" placeholder="Filter binder" aria-label="Filter binder"></div>
      <div class="tree" id="tree" role="tree"></div>
      <div class="binder-f">
        <button class="icon-btn" id="b-newdoc" title="New document (Alt+N)"></button>
        <button class="icon-btn" id="b-newfolder" title="New folder or chapter"></button>
        <button class="icon-btn" id="b-import" title="Import documents"></button>
      </div>
    </aside>

    <section class="center-wrap">
      <div id="banner"></div>
      <div class="findbar" id="findbar" hidden></div>
      <div class="panes">
        <div class="center" id="center"></div>
        <section class="split" id="split" hidden aria-label="Split view">
          <div class="split-head" id="split-head"></div>
          <div class="split-body" id="split-body"></div>
        </section>
      </div>
      <div class="speakbar" id="speakbar" hidden role="toolbar" aria-label="Read aloud"></div>
    </section>

    <aside class="inspector" aria-label="Inspector">
      <div class="tabs" id="insp-tabs"></div>
      <div class="insp-body" id="insp-body"></div>
    </aside>
  </main>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="focus-hud" id="focus-hud" hidden></div>
<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

const ONES = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];

/* build a flat list of blocks from the manuscript */
function compileModel(o) {
  const out = []; let ch = 0, pt = 0;
  const chapterTitle = f => {
    ch++;
    const t = f.title || '';
    const generic = /^chapter\s+[\divxlc]+$/i.test(t.trim());
    switch (o.chapterStyle) {
      case 'words': return { label: 'Chapter ' + numWords(ch), title: generic ? '' : t };
      case 'numbers': return { label: 'Chapter ' + ch, title: generic ? '' : t };
      case 'numeral': return { label: String(ch), title: generic ? '' : t };
      case 'title': return { label: t, title: '' };
      default: return { label: '', title: '' };
    }
  };
  const walk = (id) => {
    let lastWasText = false;
    for (const c of I(id).children) {
      const it = I(c); if (it.include === false) continue;
      if (it.type === 'folder') {
        const kind = it.kind || 'chapter';
        if (kind === 'part') { pt++; if (o.partHeadings) out.push({ t: 'part', label: 'Part ' + numWords(pt), title: /^(act|part)\s/i.test(it.title) ? '' : it.title }); }
        else if (kind === 'chapter') { const h = chapterTitle(it); out.push({ t: 'chapter', ...h }); }
        walk(c); lastWasText = false;
      } else if (it.type === 'text') {
        if (lastWasText) out.push({ t: 'break' });
        if (o.includeSynopsis && it.synopsis) out.push({ t: 'synopsis', text: it.synopsis });
        out.push({ t: 'text', html: stripComments(it.content), title: it.title });

  const inl = s => esc(s).replace(/\*\*(.+?)\*\*|__(.+?)__/g, (m, a, b) => `<strong>${a || b}</strong>`).replace(/(?<![*\w])\*(?!\s)(.+?)\*(?!\*)|(?<![_\w])_(?!\s)(.+?)_(?![_\w])/g, (m, a, b) => `<em>${a || b}</em>`).replace(/~~(.+?)~~/g, '<s>$1</s>');

    if (/^(\*\s*\*\s*\*|-{3,}|_{3,}|#)$/.test(b)) return '<hr>';
    if (/^>\s?/.test(b)) return `<blockquote><p>${inl(b.replace(/^>\s?/gm, ''))}</p></blockquote>`;
    if (/^[-*+]\s/.test(b)) return '<ul>' + b.split('\n').map(l => `<li>${inl(l.replace(/^[-*+]\s+/, ''))}</li>`).join('') + '</ul>';
    if (/^\d+\.\s/.test(b)) return '<ol>' + b.split('\n').map(l => `<li>${inl(l.replace(/^\d+\.\s+/, ''))}</li>`).join('') + '</ol>';

}
async function docxToHTML(buf) {
  const z = await readZip(buf);

  const xml = new TextDecoder().decode(await get());

  const paras = body.getElementsByTagNameNS(W, 'p');
  for (const p of paras) {
    const ppr = kid(p, 'pPr'); const style = ppr && kid(ppr, 'pStyle') ? ppr && kid(ppr, 'pStyle').getAttributeNS(W, 'val') : '';
    const jc = ppr && kid(ppr, 'jc') ? kid(ppr, 'jc').getAttributeNS(W, 'val') : '';
    const isList = ppr && kid(ppr, 'numPr');
    let inner = '';
    const runs = p.getElementsByTagNameNS(W, 'r');
    for (const r of runs) {
      const rpr = kid(r, 'rPr'); let t = '';
      for (const c of r.childNodes) {
        if (c.namespaceURI !== W) continue;

        else if (c.localName === 'tab') t += ' ';
        else if (c.localName === 'br') t += (c.getAttributeNS(W, 'type') === 'page' ? '' : '<br>');

      if (!t) continue;
      if (rpr) { if (on(kid(rpr, 'i'))) t = `<em>${t}</em>`; if (on(kid(rpr, 'b'))) t = `<strong>${t}</strong>`; if (kid(rpr, 'u') && on(kid(rpr, 'u'))) t = `<u>${t}</u>`; if (on(kid(rpr, 'strike'))) t = `<s>${t}</s>`; }
      inner += t;
    }
    const plain = inner.replace(/<[^>]+>/g, '').trim();
    const hm = /^(?:Heading|heading)\s?(\d)$/.exec(style) || (/^Title$/i.test(style) ? [0, 1] : null);
    if (isList) { if (!list) { list = '<ul>'; } list += `<li>${inner}</li>`; continue; }
    if (list) { out += list + '</ul>'; list = null; }
    if (hm) { const lv = Math.min(3, +hm[1] || 1); out += `<h${lv}>${plain ? esc(plain) : ''}</h${lv}>`; continue; }
    if (/^(#|\*\s*\*\s*\*|\*{3}|~+|⁂)$/.test(plain)) { out += '<hr>'; continue; }
    if (!plain) continue;
    out += `<p${/^(center|right|both)$/.test(jc) ? ` style="text-align:${jc === 'both' ? 'justify' : jc}"` : ''}>${inner}</p>`;

}
function importHTML(html, name, dest, split) {
  const tpl = document.createElement('template'); tpl.innerHTML = html;
  const blocks = [...tpl.content.children];
  const ser = els => els.map(e => e.outerHTML).join('');
  const inMs = zoneOf(dest) === 'manuscript' || dest === 'manuscript';
  const docType = ZONE_TYPE[isRoot(dest) ? dest : zoneOf(dest)] || 'text';
  const mkDoc = (parent, title, els) => { const it = mk(S.p, docType, title, { content: ser(els), status: inMs ? 'First draft' : '' }); add(S.p, parent, it); return 1; };
  if (split === 'none') return mkDoc(dest, name, blocks);
  let n = 0;
  if (split === 'headings' && blocks.some(b => /^H[12]$/.test(b.tagName))) {
    const chapters = []; let cur = null;
    for (const b of blocks) { if (/^H[12]$/.test(b.tagName)) { cur = { title: b.textContent.trim() || 'Chapter', els: [] }; chapters.push(cur); } else { if (!cur) { cur = { title: name, els: [] }; chapters.push(cur); } cur.els.push(b); } }
    const holder = chapters.length > 1 ? dest : dest;
    for (const ch of chapters) {
      const f = mk(S.p, 'folder', ch.title, { kind: inMs ? 'chapter' : 'none', open: false }); add(S.p, holder, f);
      const scenes = [[]]; for (const e of ch.els) { if (e.tagName === 'HR') scenes.push([]); else scenes[scenes.length - 1].push(e); }
      scenes.filter(s => s.length).forEach((s, i) => { n += mkDoc(f.id, 'Scene ' + (i + 1), s); });
      if (!f.children.length) n += mkDoc(f.id, 'Scene 1', []);
    }
    return n;
  }
  const scenes = [[]]; for (const e of blocks) { if (e.tagName === 'HR') scenes.push([]); else scenes[scenes.length - 1].push(e); }
  const real = scenes.filter(s => s.length);
  if (real.length <= 1) return mkDoc(dest, name, blocks);
  const f = mk(S.p, 'folder', name, { kind: inMs ? 'chapter' : 'none' }); add(S.p, dest, f);
  real.forEach((s, i) => { n += mkDoc(f.id, `${name} ${i + 1}`, s); });
  return n;
}

/* =========================================================
   Folio — installable app (PWA): offline cache, install button,
   opening .folio files from the computer, update notice.
   Does nothing when Folio is opened as a plain file.
   ========================================================= */
const PWA = { prompt: null, hosted: /^https?:$/.test(location.protocol) && !!document.querySelector('link[rel=manifest]'), ready: null };
PWA.installed = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches || navigator.standalone === true;
PWA.canInstall = () => !!PWA.prompt && !PWA.installed();

const SITE_URL = 'https://malcarez.github.io/Folio/';
async function shareFolio() {
  closeMenu();
  const url = PWA.hosted ? location.origin + location.pathname.replace(/index\.html$/, '') : SITE_URL;
  const text = 'Folio is a free writing studio for short stories, novellas and novels. It runs in your browser, works offline, and your writing stays on your own computer. Open the link, then click “Install app”.';
  if (navigator.share) {
    try { await navigator.share({ title: 'Folio Writing Studio', text, url }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const inp = h('input', { class: 'inp', type: 'text', readonly: true, value: url, 'aria-label': 'Folio link', onfocus: e => e.target.select() });
  const msg = h('textarea', { class: 'inp', rows: 4, readonly: true, 'aria-label': 'Message to send', value: text + '\n\n' + url, style: { resize: 'vertical' } });
  const copy = async (val, what) => { try { await navigator.clipboard.writeText(val); toast(what + ' copied.'); } catch { toast('Select the text and copy it with Ctrl+C.'); } };
  modal({ title: 'Share Folio with a writer', body: h('div', { class: 'share-box' },
    h('p', {}, 'Send this link to anyone you’d like to use Folio. Each person’s writing is saved only on their own device; nobody, including you, can see anyone else’s work.'),
    h('label', { class: 'fld' }, h('span', {}, 'Link'), h('div', { class: 'share-row' }, inp, h('button', { class: 'btn', onclick: () => copy(url, 'Link') }, icon('copy', 15), 'Copy'))),
    h('label', { class: 'fld' }, h('span', {}, 'Or copy a ready-made message'), msg),
    h('button', { class: 'btn sm', onclick: () => copy(msg.value, 'Message') }, icon('copy', 14), 'Copy message')),
    actions: [{ label: 'Done', primary: true }] });
}

async function installApp() {
  if (PWA.prompt) {
    PWA.prompt.prompt();
    const { outcome } = await PWA.prompt.userChoice.catch(() => ({}));
    PWA.prompt = null; refreshInstallUI();
    if (outcome === 'accepted') toast('Folio is installed. Open it from your Start menu, Dock or desktop.', 5000);
    return;
  }
  // No automatic prompt available (Safari, Firefox, or already installed): explain the manual route.
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const safari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent);
  const how = PWA.installed() ? 'Folio is already running as an installed app.'
    : !PWA.hosted ? 'Folio can only be installed from its web address (for example your GitHub Pages link), not from a downloaded file.'
    : ios ? 'In Safari, tap the Share button, then “Add to Home Screen”.'
    : safari ? 'In Safari, choose File › Add to Dock.'
    : 'In Chrome or Edge, click the install icon at the right end of the address bar, or open the browser menu and choose “Install Folio” (Edge: Apps › Install this site as an app).';
  modal({ title: 'Install Folio', body: h('p', {}, how), actions: [{ label: 'OK', primary: true }] });
}

function refreshInstallUI() {
  const b = document.getElementById('b-install');
  if (b) b.hidden = !PWA.canInstall();
  const hb = document.getElementById('home-install');
  if (hb) hb.hidden = !PWA.canInstall();
}

function initPWA() {
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; refreshInstallUI(); });
  window.addEventListener('appinstalled', () => { PWA.prompt = null; refreshInstallUI(); });

  // Double-clicked .folio files (installed app, Chrome/Edge). Wait until Folio has started.
  if ('launchQueue' in window) {
    launchQueue.setConsumer(async params => {
      if (!params.files || !params.files.length) return;
      await PWA.ready;
      for (const hnd of params.files.slice(0, 1)) {
        try {
          const file = await hnd.getFile();
          const p = validateProject(JSON.parse(await file.text()));
          if (S.p) { flushEditors(); persistSoon.flush(); }
          await adoptProject(p, hnd);
          toast('Opened ' + hnd.name);
        } catch (e) { toast('Could not open ' + (hnd.name || 'that file') + ': ' + e.message, 5000); }
      }
    });
  }

  if (!PWA.hosted || !('serviceWorker' in navigator)) return;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) location.reload(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => {
      const t = h('div', { class: 'toast update' }, 'A new version of Folio is ready. ',
        h('button', { class: 'btn sm primary', onclick: async () => {
          if (S.p) { flushEditors(); persistSoon.flush(); await persist(); }
          reloading = true; w.postMessage('skipWaiting');
        } }, 'Update now'),
        h('button', { class: 'btn sm', onclick: () => t.remove() }, 'Later'));
      $('#toasts').append(t);
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    // Look for updates whenever Folio comes back to the foreground (at most hourly).
    let last = Date.now();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - last > 3600e3) { last = Date.now(); reg.update().catch(() => { }); } });
  }).catch(e => console.warn('Offline support unavailable:', e));
}

  endTour();
  TOUR.steps = steps; TOUR.i = 0; TOUR.name = name; TOUR.panes = { binder: PREFS.binder, insp: PREFS.insp };
  TOUR.back = h('div', { class: 'tour-back', onclick: e => { if (e.target === TOUR.back) endTour(); } });
  TOUR.hole = h('div', { class: 'tour-hole' });
  TOUR.el = h('div', { class: 'tour-pop', role: 'dialog', 'aria-live': 'polite' });
  document.body.append(TOUR.back, TOUR.hole, TOUR.el);
  document.addEventListener('keydown', tourKey, true);
  addEventListener('resize', placeTour);
  showStep();
}
function tourKey(e) {
  if (!TOUR.steps) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); endTour(); }
  else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); tourGo(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); tourGo(-1); }
}
function tourGo(d) {
  const n = TOUR.i + d;
  if (n >= TOUR.steps.length) { const name = TOUR.name; endTour(); markRead(name); return; }
  if (n < 0) return;
  TOUR.i = n; showStep();
}
function tourTarget(st) {
  const find = s => { if (!s) return null; const el = typeof s === 'function' ? s() : $(s); if (!el) return null; const r = el.getBoundingClientRect(); return r.width > 2 && r.height > 2 && getComputedStyle(el).visibility !== 'hidden' ? el : null; };
  return find(st.sel) || find(st.alt);
}
function showStep() {
  const st = TOUR.steps[TOUR.i];
  try { st.prep && st.prep(); } catch (e) { console.warn(e); }
  const last = TOUR.i === TOUR.steps.length - 1;
  TOUR.el.textContent = '';
  TOUR.el.append(
    h('div', { class: 'tour-count' }, `${TOUR.i + 1} of ${TOUR.steps.length}`),
    h('h3', {}, st.title),
    h('div', { class: 'tour-text', html: st.text }),
    h('div', { class: 'tour-f' },
      h('button', { class: 'link-btn', onclick: endTour }, 'End tour'), h('span', { class: 'spacer' }),
      TOUR.i ? h('button', { class: 'btn sm', onclick: () => tourGo(-1) }, 'Back') : null,
      h('button', { class: 'btn sm primary', onclick: () => tourGo(1) }, last ? 'Finish' : 'Next')));
  requestAnimationFrame(() => requestAnimationFrame(placeTour));
  setTimeout(() => TOUR.el && TOUR.el.querySelector('.btn.primary')?.focus({ preventScroll: true }), 30);
}
function placeTour() {
  if (!TOUR.steps) return;
  const st = TOUR.steps[TOUR.i]; const el = tourTarget(st);
  const pop = TOUR.el, hole = TOUR.hole, vw = innerWidth, vh = innerHeight, pad = 6;
  pop.style.maxWidth = Math.min(340, vw - 24) + 'px';
  if (!el) {
    hole.style.cssText = 'left:50%;top:50%;width:0;height:0';
    pop.style.left = Math.max(12, (vw - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(12, (vh - pop.offsetHeight) / 2) + 'px';
    return;
  }
  el.scrollIntoView && el.getBoundingClientRect().bottom > vh && el.scrollIntoView({ block: 'nearest' });
  const r = el.getBoundingClientRect();
  const R = { l: Math.max(4, r.left - pad), t: Math.max(4, r.top - pad), r: Math.min(vw - 4, r.right + pad), b: Math.min(vh - 4, r.bottom + pad) };
  hole.style.cssText = `left:${R.l}px;top:${R.t}px;width:${R.r - R.l}px;height:${R.b - R.t}px`;
  const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 12;
  let x, y;
  if (vh - R.b >= ph + gap) { y = R.b + gap; x = (R.l + R.r) / 2 - pw / 2; }            // below
  else if (R.t >= ph + gap) { y = R.t - ph - gap; x = (R.l + R.r) / 2 - pw / 2; }      // above
  else if (vw - R.r >= pw + gap) { x = R.r + gap; y = (R.t + R.b) / 2 - ph / 2; }      // right
  else if (R.l >= pw + gap) { x = R.l - pw - gap; y = (R.t + R.b) / 2 - ph / 2; }      // left
  else { x = (vw - pw) / 2; y = vh - ph - 16; }                                         // overlap, bottom
  pop.style.left = Math.max(12, Math.min(vw - pw - 12, x)) + 'px';
  pop.style.top = Math.max(12, Math.min(vh - ph - 12, y)) + 'px';
}
function endTour() {
  if (!TOUR.steps) return;
  TOUR.steps = null; [TOUR.back, TOUR.hole, TOUR.el].forEach(e => e && e.remove());
  document.removeEventListener('keydown', tourKey, true); removeEventListener('resize', placeTour);
  // Put the binder and inspector back the way they were (they overlay the page on small screens).
  if (TOUR.panes && S.p && (PREFS.binder !== TOUR.panes.binder || PREFS.insp !== TOUR.panes.insp)) { Object.assign(PREFS, TOUR.panes); savePrefs(); buildChrome(); }
  TOUR.panes = null;
}
